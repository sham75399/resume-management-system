<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Add Applicant - Resume Management</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>
    <nav class="navbar">
        <div class="nav-container">
            <a href="dashboard.html" class="nav-brand">Resume Manager</a>
            <div class="nav-menu">
                <a href="dashboard.html">Dashboard</a>
                <a href="applicants.html">Applicants</a>
                <a href="applicant-form.html">Add New</a>
                <span class="welcome-text" id="welcomeUser"></span>
                <button onclick="logout()" class="btn-logout">Logout</button>
            </div>
        </div>
    </nav>

    <div class="container">
        <div class="card">
            <h1 id="formTitle">Add New Applicant</h1>
            
            <div id="error" class="error" style="display: none;"></div>
            
            <form id="applicantForm" enctype="multipart/form-data">
                <div class="form-group">
                    <label>First Name *</label>
                    <input type="text" id="firstName" required>
                </div>

                <div class="form-group">
                    <label>Last Name *</label>
                    <input type="text" id="lastName" required>
                </div>

                <div class="form-group">
                    <label>Email *</label>
                    <input type="email" id="email" required>
                </div>

                <div class="form-group">
                    <label>Phone *</label>
                    <input type="tel" id="phone" required>
                </div>

                <div class="form-group">
                    <label>Skills (comma separated)</label>
                    <input type="text" id="skills" placeholder="e.g., JavaScript, React, Node.js">
                </div>

                <div class="form-group">
                    <label>Experience (years) *</label>
                    <input type="number" id="experience" min="0" required>
                </div>

                <div class="form-group">
                    <label>Status</label>
                    <select id="status">
                        <option value="Applied">Applied</option>
                        <option value="Interview">Interview</option>
                        <option value="Hired">Hired</option>
                        <option value="Rejected">Rejected</option>
                    </select>
                </div>

                <div class="form-group">
                    <label>Resume *</label>
                    <input type="file" id="resume" accept=".pdf,.doc,.docx" required>
                    <small>Max size: 5MB. Allowed: PDF, DOC, DOCX</small>
                </div>

                <div class="form-group">
                    <label>Notes</label>
                    <textarea id="notes" rows="4"></textarea>
                </div>

                <div>
                    <button type="submit" class="btn btn-primary">Save</button>
                    <button type="button" onclick="window.location.href='applicants.html'" class="btn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
